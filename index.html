<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0f0f19;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #ff758c;
            font-family: sans-serif;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 117, 140, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info" id="statusText">Loading...</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        const numParticles = 350;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.targetX = this.x;
                this.targetY = this.y;
                this.color = `hsl(${Math.random() * 40 + 320}, 100%, 75%)`;
                this.size = Math.random() * 1.5 + 1.5;
            }
            update() {
                this.x += (this.targetX - this.x) * 0.08;
                this.y += (this.targetY - this.y) * 0.08;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }

        // Function to generate coordinates from text or shapes
        function getPointsFromText(text) {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = canvas.width;
            offCanvas.height = canvas.height;
            const offCtx = offCanvas.getContext('2d');
            
            offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
            offCtx.fillStyle = 'white';
            offCtx.font = 'bold 100px sans-serif';
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(text, offCanvas.width / 2, offCanvas.height / 2);
            
            const imgData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
            const pixels = imgData.data;
            const points = [];
            
            // Step size controls point density
            const step = 6; 
            for (let y = 0; y < offCanvas.height; y += step) {
                for (let x = 0; x < offCanvas.width; x += step) {
                    const index = (y * offCanvas.width + x) * 4;
                    if (pixels[index + 3] > 128) {
                        points.push({ x: x, y: y });
                    }
                }
            }
            return points;
        }

        const sequences = ["3", "2", "1", "I ❤️ U"];
        let currentIndex = 0;

        function updateTargets() {
            const currentText = sequences[currentIndex];
            document.getElementById('statusText').innerText = currentText === "I ❤️ U" ? "I LOVE YOU" : `Countdown: ${currentText}`;
            
            let targets = getPointsFromText(currentText);

            particles.forEach((p, index) => {
                if (targets.length > 0) {
                    const target = targets[index % targets.length];
                    p.targetX = target.x + (Math.random() - 0.5) * 4;
                    p.targetY = target.y + (Math.random() - 0.5) * 4;
                } else {
                    p.targetX = Math.random() * canvas.width;
                    p.targetY = Math.random() * canvas.height;
                }
            });

            currentIndex = (currentIndex + 1) % sequences.length;
        }

        // Initial trigger and loop every 3 seconds
        updateTargets();
        setInterval(updateTargets, 3000);

        function animate() {
            // Solid dark background clear to prevent messy trails and blurriness
            ctx.fillStyle = '#0f0f19';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
