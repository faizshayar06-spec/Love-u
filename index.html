<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Particles Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0b1c 0%, #080309 100%);
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #ff94b8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.7);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info" id="statusText">✨ Loading Magic ✨</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        const numParticles = 800; // Increased for a dense, premium look

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.targetX = this.x;
                this.targetY = this.y;
                // Romantic rose gold, pink, and soft red hues
                this.color = `hsl(${Math.random() * 30 + 330}, 100%, ${Math.random() * 20 + 65}%)`;
                this.size = Math.random() * 1.8 + 1.2;
                this.ease = Math.random() * 0.04 + 0.05; // Smooth flowing speed
            }
            update() {
                this.x += (this.targetX - this.x) * this.ease;
                this.y += (this.targetY - this.y) * this.ease;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }

        // Generate coordinates from text with much larger scaling for mobile screens
        function getPointsFromText(text) {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = canvas.width;
            offCanvas.height = canvas.height;
            const offCtx = offCanvas.getContext('2d');
            
            offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
            offCtx.fillStyle = 'white';
            
            // Responsive large font size so it covers a great portion of the screen
            let fontSize = Math.min(canvas.width / 4.5, 150);
            if(text === "I ❤️ U") fontSize = Math.min(canvas.width / 5.5, 110);
            
            offCtx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(text, offCanvas.width / 2, offCanvas.height / 2);
            
            const imgData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
            const pixels = imgData.data;
            const points = [];
            
            // Step size controls density (lower = denser)
            const step = 4; 
            for (let y = 0; y < offCanvas.height; y += step) {
                for (let x = 0; x < offCanvas.width; x += step) {
                    const index = (y * offCanvas.width + x) * 4;
                    if (pixels[index + 3] > 128) {
                        points.push({ x: x, y: y });
                    }
                }
            }
            return points;
        }

        const sequences = ["3", "2", "1", "I ❤️ U"];
        let currentIndex = 0;

        function updateTargets() {
            const currentText = sequences[currentIndex];
            document.getElementById('statusTextinnerText = currentText === "I ❤️ U" ? "FOREVER YOURS ❤️" : `✨ ${currentText} ✨`;
            document.getElementById('statusText').innerText = currentText === "I ❤️ U" ? "FOREVER YOURS ❤️" : `✨ ${currentText} ✨`;
            
            let targets = getPointsFromText(currentText);

            particles.forEach((p, index) => {
                if (targets.length > 0) {
                    const target = targets[index % targets.length];
                    p.targetX = target.x + (Math.random() - 0.5) * 3;
                    p.targetY = target.y + (Math.random() - 0.5) * 3;
                } else {
                    p.targetX = Math.random() * canvas.width;
                    p.targetY = Math.random() * canvas.height;
                }
            });

            currentIndex = (currentIndex + 1) % sequences.length;
        }

        // Initial trigger and loop every 3.5 seconds
        updateTargets();
        setInterval(updateTargets, 3500);

        function animate() {
            // Luxurious dark trail fade for romantic depth effect
            ctx.fillStyle = 'rgba(10, 4, 12, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
