<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Particles</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0f0f19;
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .video-element {
            display: none;
        }
        .info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <video class="video-element" id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="info">Show 1, 2 or 5 (Open hand) fingers in front of camera!</div>

    <!-- MediaPipe Libraries for Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const numParticles = 400;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.targetX = this.x;
                this.targetY = this.y;
                this.color = `hsl(${Math.random() * 60 + 300}, 100%, 75%)`;
            }
            update() {
                this.x += (this.targetX - this.x) * 0.1;
                this.y += (this.targetY - this.y) * 0.1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }

        function setTargetShape(state) {
            let targets = [];
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            if (state === 1) {
                for (let y = cy - 100; y <= cy + 100; y += 12) targets.push({x: cx, y: y});
                for (let x = cx - 30; x <= cx; x += 12) targets.push({x: x, y: cy - 100});
            } else if (state === 2) {
                for (let x = cx - 50; x <= cx + 50; x += 12) targets.push({x: x, y: cy - 80});
                for (let y = cy - 80; y <= cy; y += 12) targets.push({x: cx + 50, y: y});
                for (let x = cx - 50; x <= cx + 50; x += 12) targets.push({x: x, y: cy});
                for (let y = cy; y <= cy + 80; y += 12) targets.push({x: cx - 50, y: y});
                for (let x = cx - 50; x <= cx + 50; x += 12) targets.push({x: x, y: cy + 80});
            } else if (state >= 5) {
                // Heart Shape
                for (let t = 0; t < Math.PI * 2; t += 0.08) {
                    let hx = 16 * Math.pow(Math.sin(t), 3);
                    let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    targets.push({x: cx + hx * 12, y: cy + hy * 12});
                }
            } else {
                for (let i = 0; i < numParticles; i++) {
                    targets.push({x: Math.random() * canvas.width, y: Math.random() * canvas.height});
                }
            }

            particles.forEach((p, index) => {
                if (index < targets.length) {
                    p.targetX = targets[index].x;
                    p.targetY = targets[index].y;
                } else {
                    p.targetX = Math.random() * canvas.width;
                    p.targetY = Math.random() * canvas.height;
                }
            });
        }

        function countFingers(landmarks) {
            const tips = [4, 8, 12, 16, 20];
            let count = 0;
            if (landmarks[tips[0]].x < landmarks[tips[0] - 1].x) count++;
            for (let i = 1; i < 5; i++) {
                if (landmarks[tips[i]].y < landmarks[tips[i] - 2].y) count++;
            }
            return count;
        }

        const videoElement = document.getElementById('webcam');
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65
        });

        hands.onResults((results) => {
            let state = 0;
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                state = countFingers(results.multiHandLandmarks[0]);
            }
            setTargetShape(state);
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 480,
            height: 360
        });
        camera.start();

        function animate() {
            ctx.fillStyle = 'rgba(15, 15, 25, 0.35)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
